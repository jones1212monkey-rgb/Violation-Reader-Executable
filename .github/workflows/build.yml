name: Build C++ Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Create test program
        shell: pwsh
        run: |
          @'
          #include <iostream>
          int main() {
              std::cout << "Hello from Windows!" << std::endl;
              return 0;
          }
          '@ | Set-Content test.cpp

      - name: Compile
        shell: pwsh
        run: |
          cl /EHsc /O2 test.cpp /Fe:TestProgram.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TestProgram
          path: TestProgram.exe
